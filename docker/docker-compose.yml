# Disposable MySQL for Apache Fineract (fineract-buildable) integration testing.
#
# This is a 2016-era stack (Spring Boot 1.1.6 / OpenJPA / drizzle-jdbc:thin 1.3 / 363 Flyway
# migrations written for MySQL 5.x). We pin MySQL 5.7 deliberately:
#   * 5.7 keeps mysql_native_password as the default auth plugin — the ancient drizzle-jdbc:thin
#     driver predates MySQL 8's caching_sha2_password and cannot authenticate against 8.x.
#   * The 2016 migrations rely on lenient SQL behaviour (zero-dates, non-ONLY_FULL_GROUP_BY,
#     implicit TIMESTAMP defaults) that MySQL 8's strict defaults reject.
#
# Credentials are fixed to root/mysql to match the values hard-coded in the build + app config:
#   * fineract-provider/build.gradle           -> mysqlUser=root, mysqlPassword=mysql
#   * src/test/resources/META-INF/context.xml  -> jdbc/mifosplatform-tenants  root/mysql
#   * list_db V1 default tenant row            -> schema_username=root, schema_password=mysql
name: fineract-legacy-db

services:
  mysql:
    image: mysql:5.7
    container_name: fineract-mysql57
    command:
      - "--sql-mode="                          # 2016 migrations use zero-dates / non-full-group-by
      - "--character-set-server=utf8"          # Fineract expects utf8 (5.7 server default is latin1)
      - "--collation-server=utf8_general_ci"
      - "--explicit-defaults-for-timestamp=0"  # match 5.5/5.6 implicit TIMESTAMP behaviour
      - "--max-allowed-packet=256M"
    environment:
      MYSQL_ROOT_PASSWORD: "mysql"
      MYSQL_ROOT_HOST: "%"                      # allow root over TCP from the host (published port)
    ports:
      - "3306:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro  # runs once on a fresh data volume
      - fineract-mysql57-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

volumes:
  fineract-mysql57-data:
